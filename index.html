<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Style Library</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for running JSX in browser -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #FFFDF9; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .neo-brutalism {
            box-shadow: 6px 6px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease;
        }
        .neo-brutalism:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
        }
        .neo-brutalism:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(0,0,0,1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const I18N = {
            en: {
                title: "Style Library",
                subtitle: "NotebookLM Design Engine",
                description: "A curated library of 20+ precise design specifications. Feed these prompts into NotebookLM to generate structured, visually cohesive document layouts.",
                slideDeck: "Slide Deck",
                infographic: "Infographic",
                searchPlaceholder: "Search styles...",
                step1: "1. Format",
                step2: "2. Topic",
                setActiveTopic: "Set Active Topic",
                topicActive: "Topic Active",
                clear: "CLEAR",
                topicInputPlaceholder: (mode) => `Type topic for your ${mode}...`,
                promptOutput: "Spec Output",
                copyBtn: (mode) => `COPY ${mode.toUpperCase()} PROMPT`,
                copied: "COPIED!",
                patterns: "20 Patterns",
                quality: "High-Fidelity Prompting",
                support: "Support Project",
                footer: "NotebookLM Design Spec Library",
                langToggle: "繁體中文",
                stylesCount: "Styles Available"
            },
            zh: {
                title: "風格庫",
                subtitle: "NotebookLM 設計引擎",
                description: "包含 20 多種精確設計規格的策劃庫。將這些提示詞輸入 NotebookLM，即可產生結構化且視覺一致的排版草案。",
                slideDeck: "簡報方案",
                infographic: "資訊圖表",
                searchPlaceholder: "搜尋風格...",
                step1: "1. 格式",
                step2: "2. 主題",
                setActiveTopic: "設定目前主題",
                topicActive: "主題已啟用",
                clear: "清除",
                topicInputPlaceholder: (mode) => `請輸入您的${mode === "infographic" ? "資訊圖表" : "簡報"}主題...`,
                promptOutput: "規格輸出",
                copyBtn: (mode) => `複製${mode === "infographic" ? "資訊圖表" : "簡報"}提示詞`,
                copied: "已複製！",
                patterns: "20 種樣式",
                quality: "高擬真提示詞",
                support: "贊助項目",
                footer: "NotebookLM 設計規格庫",
                langToggle: "English",
                stylesCount: "種可用風格"
            }
        };

        const VISUAL_STYLES = [
            // Playful & Handcrafted
            { name: "Kawaii Pastel", nameZh: "可愛粉彩", vibe: "Cute, bubbly, friendly, soft", vibeZh: "可愛、活潑、友善、柔軟", bg: "#FFF0F5", accent: "#FFB6C1", elements: "Floating sparkles", elementsZh: "漂浮閃爍元素" },
            { name: "90s Cartoon", nameZh: "90年代卡通", vibe: "High-contrast, playful, nostalgic", vibeZh: "高對比、俏皮、懷舊", bg: "#FFFFFF", accent: "#00FF00", elements: "Checkerboard", elementsZh: "棋盤格" },
            { name: "Studio Ghibli", nameZh: "吉卜力風", vibe: "Dreamy, organic, warm", vibeZh: "夢幻、有機、溫暖", bg: "#E8F5E9", accent: "#4CAF50", elements: "Watercolor textures", elementsZh: "水彩紋理" },
            { name: "Claymation 3D", nameZh: "3D 黏土", vibe: "Handmade, chunky, textured", vibeZh: "手工感、厚實、紋理", bg: "#FDF5E6", accent: "#FF4500", elements: "Fingerprints", elementsZh: "指紋紋理" },
            { name: "Paper Cutout", nameZh: "剪紙藝術", vibe: "Layered, organic, handcrafted", vibeZh: "層次感、有機、手工", bg: "#F5F5DC", accent: "#D2691E", elements: "Drop shadows", elementsZh: "投影層次" },
            
            // Technical & Analytical
            { name: "Scientific Blueprint", nameZh: "科學藍圖", vibe: "Analytical, precise, engineering", vibeZh: "分析性、精確、工程感", bg: "#0047AB", accent: "#FFFFFF", elements: "Grid lines, measurements", elementsZh: "網格線、測量標記" },
            { name: "Architectural Vellum", nameZh: "建築描圖紙", vibe: "Sophisticated, technical, light", vibeZh: "精緻、技術性、輕盈", bg: "#F0F4F8", accent: "#2D3748", elements: "Drafting marks", elementsZh: "草圖標記" },
            { name: "Terminal / Hacker", nameZh: "終端機", vibe: "Retro-computing, raw, focused", vibeZh: "復古計算、原始、專注", bg: "#000000", accent: "#00FF41", elements: "ASCII Art", elementsZh: "ASCII 藝術" },
            { name: "Swiss Brutalism", nameZh: "瑞士粗獷", vibe: "Bold, industrial, high-contrast", vibeZh: "大膽、工業風、高對比", bg: "#A9A9A9", accent: "#FF4F00", elements: "Blocky grids", elementsZh: "塊狀網格" },
            
            // Modern & Sophisticated
            { name: "Cyber-Zen", nameZh: "賽博禪意", vibe: "Clean, ethereal, high-tech", vibeZh: "乾淨、空靈、高科技", bg: "#0A0E14", accent: "#00F3FF", elements: "Glassmorphism", elementsZh: "玻璃擬態" },
            { name: "Japanese Stationery", nameZh: "日式文具", vibe: "Minimalist, calm, airy", vibeZh: "極簡、冷靜、輕盈", bg: "#F9F9F9", accent: "#00416A", elements: "Hanko stamps", elementsZh: "印章元素" },
            { name: "Luxury Noir", nameZh: "奢華魅影", vibe: "Elegant, dark, premium", vibeZh: "優雅、黑暗、高級感", bg: "#1A1A1A", accent: "#D4AF37", elements: "Gold foil lines", elementsZh: "金箔線條" },
            { name: "Midnight Gradient", nameZh: "午夜漸層", vibe: "Modern, smooth, moody", vibeZh: "現代、流暢、情緒化", bg: "#121212", accent: "#6366F1", elements: "Aura glows", elementsZh: "光暈效果" },
            
            // Retro & Artistic
            { name: "Bauhaus Revival", nameZh: "包浩斯復興", vibe: "Geometric, retro-modern", vibeZh: "幾何、復古現代", bg: "#F4F1EA", accent: "#FF0000", elements: "Primary color blocks", elementsZh: "原色色塊" },
            { name: "Risograph Print", nameZh: "孔版印刷", vibe: "Retro, grainy, high-energy", vibeZh: "復古、顆粒感、高能量", bg: "#FFF5F5", accent: "#FF007F", elements: "Ink textures", elementsZh: "油墨紋理" },
            { name: "Vintage Field Guide", nameZh: "復古野外指南", vibe: "Academic, heritage", vibeZh: "學術性、傳統感", bg: "#FCF5E5", accent: "#556B2F", elements: "Botanical sketches", elementsZh: "植物素描" },
            { name: "Y2K Glitch", nameZh: "Y2K 故障藝術", vibe: "Iridescent, futuristic", vibeZh: "虹彩感、未來主義", bg: "#E0E0E0", accent: "#FF00FF", elements: "Pixel distortion", elementsZh: "像素失真" },
            
            // Communication & Business
            { name: "Infographic Pop", nameZh: "流行資訊圖", vibe: "High-energy, narrative, bold", vibeZh: "高能量、敘事性、大膽", bg: "#FFFFFF", accent: "#3B82F6", elements: "Dynamic arrows", elementsZh: "動態箭頭" },
            { name: "Corporate Memphis", nameZh: "孟菲斯商務風", vibe: "Flat, friendly, colorful", vibeZh: "扁平化、友善、豐富色彩", bg: "#F8F9FA", accent: "#F59E0B", elements: "Simple characters", elementsZh: "簡約人物" },
            { name: "Neon Collage", nameZh: "霓虹拼貼", vibe: "Tech-Art, future-oriented", vibeZh: "科技藝術、面向未來", bg: "#000000", accent: "#39FF14", elements: "Digital fragments", elementsZh: "數位碎片" }
        ];

        function App() {
            const [lang, setLang] = useState('zh');
            const [formatMode, setFormatMode] = useState('slideDeck');
            const [searchQuery, setSearchQuery] = useState('');
            const [topic, setTopic] = useState('');
            const [topicActive, setTopicActive] = useState(false);
            const [copiedId, setCopiedId] = useState(null);

            const t = I18N[lang];

            const filteredStyles = useMemo(() => {
                return VISUAL_STYLES.filter(style => {
                    const searchTerms = searchQuery.toLowerCase();
                    const name = lang === 'en' ? style.name : style.nameZh;
                    const vibe = lang === 'en' ? style.vibe : style.vibeZh;
                    return name.toLowerCase().includes(searchTerms) || vibe.toLowerCase().includes(searchTerms);
                });
            }, [searchQuery, lang]);

            const handleCopy = (text, idx) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setCopiedId(idx);
                setTimeout(() => setCopiedId(null), 2000);
            };

            const generatePrompt = (style) => {
                const baseSubject = topicActive && topic.trim() !== '' 
                    ? (lang === 'en' ? `Subject: [${topic}]` : `主題: [${topic}]`)
                    : (lang === 'en' ? `Subject: [Your Topic]` : `主題: [您的主題]`);
                
                if (lang === 'zh') {
                    const task = formatMode === 'slideDeck'
                        ? `指令: 請針對此風格生成簡報大綱。\n※ 重要要求：請為「每張投影片」提供詳細的「視覺排版描述」、「圖像提示詞 (Image Prompts)」以及「圖形與圖表配置建議」，確保充分展現此視覺風格的特色。`
                        : `指令: 請針對此風格生成資訊圖表流程。\n※ 重要要求：請詳細描述每個資料區塊的視覺元素、圖示建議和空間排版結構。`;
                    
                    return `【NotebookLM 設計規格】\n${baseSubject}\n風格: ${style.nameZh}\n氛圍: ${style.vibeZh}\n配色: 背景 ${style.bg}, 點綴 ${style.accent}\n元素: ${style.elementsZh}\n${task}`;
                } else {
                    const task = formatMode === 'slideDeck'
                        ? `Task: Generate a slide deck outline using this style.\n*CRITICAL: For each slide, you MUST provide detailed "Visual Layout Descriptions", "Image Prompts", and "Graphic/Chart Placement Suggestions" to fully showcase this specific visual style.`
                        : `Task: Generate an infographic flow using this style.\n*CRITICAL: Detail the visual elements, icon suggestions, and layout structure for each data section.`;
                        
                    return `[NotebookLM Design Spec]\n${baseSubject}\nStyle: ${style.name}\nVibe: ${style.vibe}\nPalette: BG ${style.bg}, Accent ${style.accent}\nElements: ${style.elements}\n${task}`;
                }
            };

            return (
                <div className="min-h-screen pb-24 px-4 bg-[#FFFDF9]">
                    <nav className="sticky top-0 z-50 bg-[#FFFDF9]/90 backdrop-blur-md border-b-4 border-black py-4 flex justify-between items-center mb-8 px-4 md:px-8">
                        <div className="flex items-center gap-2">
                            <div className="bg-black text-white p-1 rounded-sm"><Icon name="zap" size={20} /></div>
                            <span className="font-black text-xl uppercase tracking-tighter">{t.title}</span>
                        </div>
                        <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="border-2 border-black px-4 py-1 text-xs font-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] hover:shadow-none hover:translate-x-[2px] hover:translate-y-[2px] transition-all uppercase bg-white">
                            {t.langToggle}
                        </button>
                    </nav>

                    <div className="max-w-[1400px] mx-auto">
                        <header className="mb-10">
                            <h1 className="text-5xl lg:text-7xl font-black uppercase leading-none mb-4 tracking-tighter">{t.subtitle}</h1>
                            <p className="max-w-2xl font-bold border-l-4 border-black pl-4 text-stone-600">{t.description}</p>
                        </header>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 bg-white border-4 border-black p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] mb-12">
                            <div>
                                <label className="block text-[10px] font-black uppercase mb-2 tracking-widest text-stone-500">{t.step1}</label>
                                <div className="flex gap-2">
                                    <button onClick={() => setFormatMode('slideDeck')} className={`flex-1 py-3 border-2 border-black font-black uppercase transition-colors ${formatMode === 'slideDeck' ? 'bg-black text-white' : 'bg-white hover:bg-stone-50'}`}>{t.slideDeck}</button>
                                    <button onClick={() => setFormatMode('infographic')} className={`flex-1 py-3 border-2 border-black font-black uppercase transition-colors ${formatMode === 'infographic' ? 'bg-black text-white' : 'bg-white hover:bg-stone-50'}`}>{t.infographic}</button>
                                </div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-black uppercase mb-2 tracking-widest text-stone-500">{t.step2}</label>
                                <div className="flex gap-2">
                                    <input value={topic} onChange={e => setTopic(e.target.value)} placeholder={t.topicInputPlaceholder(formatMode)} className="flex-1 border-2 border-black px-4 font-bold outline-none focus:bg-stone-50" />
                                    <button onClick={() => setTopicActive(!topicActive)} className={`px-6 py-3 border-2 border-black font-black uppercase transition-all shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none ${topicActive ? 'bg-red-500 text-white' : 'bg-[#DFFF00]'}`}>{topicActive ? t.clear : t.setActiveTopic}</button>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col md:flex-row gap-4 justify-between items-center mb-10">
                            <div className="relative w-full md:w-96">
                                <input placeholder={t.searchPlaceholder} onChange={e => setSearchQuery(e.target.value)} className="w-full border-2 border-black p-3 pl-10 font-bold shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]" />
                                <div className="absolute left-3 top-4 text-stone-400"><Icon name="search" size={18} /></div>
                            </div>
                            <div className="bg-black text-white px-4 py-2 font-black text-xs uppercase rounded-sm">{filteredStyles.length} {t.stylesCount}</div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                            {filteredStyles.map((style, idx) => {
                                const p = generatePrompt(style);
                                return (
                                    <div key={idx} className="bg-white border-4 border-black rounded-xl overflow-hidden neo-brutalism flex flex-col">
                                        <div className="h-24 border-b-2 border-black flex items-center justify-center font-black text-[10px] uppercase opacity-20" style={{ backgroundColor: style.bg }}>Preview Area</div>
                                        <div className="p-5 flex-1 flex flex-col">
                                            <div className="flex justify-between items-start mb-1">
                                                <h3 className="font-black uppercase text-lg leading-tight">{lang === 'zh' ? style.nameZh : style.name}</h3>
                                                <div className="w-4 h-4 rounded-full border border-black" style={{ backgroundColor: style.accent }}></div>
                                            </div>
                                            <p className="text-xs font-bold text-stone-500 mb-4 h-8 overflow-hidden">{lang === 'zh' ? style.vibeZh : style.vibe}</p>
                                            <div className="bg-stone-50 border-2 border-stone-200 p-2 text-[10px] font-mono mb-4 h-24 overflow-y-auto scrollbar-hide select-all whitespace-pre-wrap">{p}</div>
                                            <button onClick={() => handleCopy(p, idx)} className={`w-full py-3 border-2 border-black font-black text-xs uppercase shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-x-[2px] active:translate-y-[2px] transition-all ${copiedId === idx ? 'bg-green-400' : 'bg-[#DFFF00]'}`}>
                                                {copiedId === idx ? t.copied : t.copyBtn(formatMode)}
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <footer className="mt-20 border-t-4 border-black pt-10 text-center">
                        <div className="flex justify-center gap-6 mb-4">
                            <div className="flex items-center gap-2 font-black text-[10px] uppercase tracking-widest opacity-40"><Icon name="layers" size={14} /> {t.patterns}</div>
                            <div className="flex items-center gap-2 font-black text-[10px] uppercase tracking-widest opacity-40"><Icon name="shield-check" size={14} /> {t.quality}</div>
                        </div>
                        <p className="font-black text-xs uppercase tracking-widest opacity-30">{t.footer} &copy; 2024</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
